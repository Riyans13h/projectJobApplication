services:
  postgres:
    image: postgres:16-alpine
    container_name: jobflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobflow}
      POSTGRES_USER: ${POSTGRES_USER:-jobflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobflow}
    ports:
      - "5432:5432"
    volumes:
      - jobflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobflow} -d ${POSTGRES_DB:-jobflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobflow-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/api}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobflow}
      DB_USERNAME: ${POSTGRES_USER:-jobflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jobflow}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-secure-secret-for-local-development}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080/api}
      LOCAL_FILE_STORAGE_DIR: ${LOCAL_FILE_STORAGE_DIR:-uploads}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      SEED_DATA_ENABLED: ${SEED_DATA_ENABLED:-false}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@jobflow.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DemoPassword123}
      SEED_DEMO_FIRST_NAME: ${SEED_DEMO_FIRST_NAME:-Demo}
      SEED_DEMO_LAST_NAME: ${SEED_DEMO_LAST_NAME:-User}
      SEED_SAMPLE_FILE_BASE_URL: ${SEED_SAMPLE_FILE_BASE_URL:-https://res.cloudinary.com/demo/raw/upload/jobflow/seed}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

volumes:
  jobflow_postgres_data:
