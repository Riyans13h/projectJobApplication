services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobflow-backend:sqlite
    container_name: jobflow-backend-sqlite
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/api}
      DB_URL: ${DB_URL:-jdbc:sqlite:/app/data/jobflow.db?busy_timeout=10000}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DRIVER: ${DB_DRIVER:-org.sqlite.JDBC}
      HIBERNATE_DIALECT: ${HIBERNATE_DIALECT:-org.hibernate.community.dialect.SQLiteDialect}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-1}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      DB_CONNECTION_INIT_SQL: ${DB_CONNECTION_INIT_SQL:-PRAGMA busy_timeout=10000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-secure-secret-for-local-development}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080/api}
      LOCAL_FILE_STORAGE_DIR: ${LOCAL_FILE_STORAGE_DIR:-/app/uploads}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      SEED_DATA_ENABLED: ${SEED_DATA_ENABLED:-true}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@jobflow.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DemoPassword123}
      SEED_DEMO_FIRST_NAME: ${SEED_DEMO_FIRST_NAME:-Demo}
      SEED_DEMO_LAST_NAME: ${SEED_DEMO_LAST_NAME:-User}
      SEED_SAMPLE_FILE_BASE_URL: ${SEED_SAMPLE_FILE_BASE_URL:-https://res.cloudinary.com/demo/raw/upload/jobflow/seed}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - jobflow_sqlite_data:/app/data
      - jobflow_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    image: jobflow-frontend:sqlite
    container_name: jobflow-frontend-sqlite
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  jobflow_sqlite_data:
  jobflow_uploads:
