spring:
  application:
    name: jobflow-backend
  
  datasource:
    url: ${DB_URL:jdbc:sqlite:./jobflow.db?busy_timeout=10000}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:1}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      connection-init-sql: PRAGMA busy_timeout=10000

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
        format_sql: true
    show-sql: false
  
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret-key: ${JWT_SECRET_KEY:your-super-secret-key-change-this-in-production-your-super-secret-key-change-this}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.1}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:60}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/api}
  file-storage:
    local-dir: ${LOCAL_FILE_STORAGE_DIR:uploads}
  seed:
    enabled: ${SEED_DATA_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.jobflow: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobflow}
    username: ${DB_USERNAME:jobflow}
    password: ${DB_PASSWORD:jobflow}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
