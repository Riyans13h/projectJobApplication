spring:
  application:
    name: jobflow-backend
  
  datasource:
    url: ${DB_URL:jdbc:sqlite:./jobflow.db?busy_timeout=10000}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:1}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      connection-init-sql: ${DB_CONNECTION_INIT_SQL:}

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
        format_sql: true
    show-sql: false
  
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

ollama:
  base-url: ${OLLAMA_BASE_URL}
  model: ${OLLAMA_MODEL}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}
  file-storage:
    local-dir: ${LOCAL_FILE_STORAGE_DIR}
  seed:
    enabled: ${SEED_DATA_ENABLED}
    demo-email: ${SEED_DEMO_EMAIL}
    demo-password: ${SEED_DEMO_PASSWORD}
    demo-first-name: ${SEED_DEMO_FIRST_NAME}
    demo-last-name: ${SEED_DEMO_LAST_NAME}
    sample-file-base-url: ${SEED_SAMPLE_FILE_BASE_URL}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.jobflow: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
